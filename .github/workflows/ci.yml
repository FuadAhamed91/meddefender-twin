name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meddefender
          POSTGRES_PASSWORD: meddefender-ci
          POSTGRES_DB: meddefender_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meddefender -d meddefender_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://meddefender:meddefender-ci@localhost:5432/meddefender_test
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag: pin a release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests (schema built by running the Alembic migrations)
        run: uv run pytest -q

  frontend:
    name: Frontend (types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  stack:
    name: Docker Compose stack (smoke + end-to-end)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Create .env as the README describes
        run: |
          cp .env.example .env
          sed -i "s|^DEVICE_KEY_MASTER_SECRET=.*|DEVICE_KEY_MASTER_SECRET=$(openssl rand -hex 32)|" .env

      - name: Build and start (waits for every healthcheck)
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Smoke checks
        run: |
          set -euo pipefail
          base=http://localhost:8080
          curl -fsS "$base/healthz"
          curl -fsS "$base/api/v1/health" | tee /dev/stderr | grep -q '"database":"ok"'
          # Security headers on the app shell; client-side routes fall back to it.
          curl -fsSI "$base/" | grep -qi '^content-security-policy:'
          curl -fsSI "$base/" | grep -qi '^x-frame-options: DENY'
          curl -fsS "$base/incidents" | grep -q '<div id="root">'
          # The Blender model is served with its glTF media type.
          curl -fsSI "$base/models/hospital.glb" | grep -qi '^content-type: model/gltf-binary'
          # API: anonymous access is refused; the seeded demo admin can sign in.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/v1/assets")" = 401
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"username":"secadmin","password":"secadmin-demo-pass-2026"}' "$base/api/v1/auth/login" > /dev/null
          count=$(curl -fsS -b cookies.txt "$base/api/v1/assets" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "assets: $count"
          test "$count" -eq 26

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: End-to-end tests against the stack
        working-directory: frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
