# Response headers for the single-page app (the API sets its own, stricter headers).
# nginx drops server-level add_header directives in any location that defines its own,
# so every static location includes this file instead.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Scripts, styles, fonts, the GLB model and API/WebSocket calls are all same-origin.
# 'unsafe-inline' styles: React and drei position overlay elements with inline styles.
# data: fonts: the build inlines the smallest font subset into the stylesheet.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
