[project]
name = "meddefender-backend"
version = "0.1.0"
description = "MedDefender Twin backend: device security pipeline, digital-twin state and simulation engine (synthetic data only)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=23.1",
    "fastapi>=0.143.2",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.54,<2.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.optional-dependencies]
# Embedded PostgreSQL for machines with neither Docker nor a local PostgreSQL install.
localpg = [
    "pgserver>=0.1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: slower integration tests",
]
filterwarnings = [
  "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
# Line length is owned by `ruff format`.
ignore = ["S101", "S311", "RUF012", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S608"]
"alembic/**" = ["E501"]
